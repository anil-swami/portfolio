<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#143D28" />
    <link rel="canonical" href="{{siteUrl}}/" />
    <link rel="alternate" href="{{siteUrl}}/simple" title="Simple view" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{name}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{siteUrl}}/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <script type="application/ld+json">{{jsonLd}}</script>
    <style>
      html, body { margin: 0; height: 100%; background: #1E5B3A; color: #EEF0E8; }
      .noscript { font-family: system-ui, sans-serif; padding: 24px; line-height: 1.55; }
      .noscript a { color: #FFB627; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="noscript">
        <h1>{{name}}</h1>
        <p>{{description}}</p>
        <p>This 3D portfolio needs JavaScript. <a href="simple.html">Open the simple view</a> to read everything without it.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
